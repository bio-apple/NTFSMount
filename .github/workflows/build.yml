name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# 只取消进行中的 PR；tag 上的安装包/公证不能被同 ref 的新 run 杀掉。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint Sources and Tests
        run: swiftlint lint --strict --config .swiftlint.yml

  shellcheck:
    name: ShellCheck
    uses: ./.github/workflows/shellcheck.yml

  shfmt:
    name: shfmt
    uses: ./.github/workflows/shfmt.yml

  markdownlint:
    name: Markdown lint
    uses: ./.github/workflows/markdownlint.yml

  test:
    name: UnitTest
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Helper selftest and compile
        run: bash scripts/test-helper.sh
      - name: Swift tests with coverage
        run: bash scripts/coverage.sh
      - name: Diagnose dump
        continue-on-error: true
        run: bash scripts/ntfsmount diagnose --json

  security:
    name: Security Scan
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Privilege and secret greps
        run: |
          set -euo pipefail
          SCAN=()
          for f in helper/*.sh helper/ntfs-rw-helper scripts/*.sh uninstall.sh; do
            [[ -f "$f" ]] || continue
            [[ "${f##*/}" == "test-helper.sh" ]] && continue
            SCAN+=("$f")
          done
          fail=0
          if /usr/bin/grep -nE 'ALL=\(root\) NOPASSWD' "${SCAN[@]}"; then
            echo "error: helper/scripts must not write sudoers NOPASSWD" >&2
            fail=1
          fi
          if /usr/bin/grep -nE 'sudo[[:space:]]+-S\b|SUDO_ASKPASS|[[:space:]]ASKPASS=|^ASKPASS=' "${SCAN[@]}"; then
            echo "error: helper/scripts must not feed sudo from stdin or set an ask-pass helper" >&2
            fail=1
          fi
          if /usr/bin/grep -nE 'echo[[:space:]].*\|[[:space:]]*sudo|printf[[:space:]].*\|[[:space:]]*sudo' "${SCAN[@]}"; then
            echo "error: helper/scripts must not pipe a secret into sudo" >&2
            fail=1
          fi
          # Literal password assignments only. Do not match env names like APPLE_CERTIFICATE_PASSWORD.
          if /usr/bin/grep -nE '(password|passwd|PASSWORD)[[:space:]]*=[[:space:]]*["'\''][^"'\'']+["'\'']' "${SCAN[@]}"; then
            echo "error: helper/scripts must not hardcode passwords" >&2
            fail=1
          fi
          if /usr/bin/grep -R -nE 'BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY' \
            --include='*.swift' --include='*.sh' --include='*.c' --include='*.plist' \
            --include='*.yml' --include='*.entitlements' \
            --exclude-dir=.git --exclude-dir=.build --exclude-dir=.swiftpm \
            .; then
            echo "error: private key material must not be in the tree" >&2
            fail=1
          fi
          exit "$fail"

  build:
    name: Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift release build
        run: swift build -c release --arch arm64 --product NTFSMount
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"

  # 完整 .app（含 runtime）只在 main / 手动跑。ntfs-3g 用仓库 runtime/ 已提交的捆绑文件，
  # 不 brew install（homebrew/core 现为 Linux-only，GitHub-hosted macOS 无 bottle；不要 --build-from-source）。
  # FUSE-T 仍由 prepare-runtime 按 SHA256SUMS 拉官方 pkg。UnitTest 只跑 swift test，不需要 ntfs-3g。
  app:
    name: App
    runs-on: macos-14
    needs: [test, build]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Import Developer ID
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: bash scripts/ci-import-signing.sh
      - name: Prepare runtime
        run: bash scripts/prepare-runtime.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify runtime SHA256
        run: bash scripts/check-runtime-sha256.sh
      - name: Build app
        run: bash scripts/build.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NTFSMount-app
          path: |
            dist/NTFSMount.app
            /tmp/NTFSMount.app
          if-no-files-found: warn
      - name: Delete signing keychain
        if: always()
        run: |
          if [[ -n "${APP_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$APP_SIGNING_KEYCHAIN" || true
          fi

  pkg-on-tag:
    name: PKG (tag)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    permissions:
      contents: write
    needs: [lint, test, security, build, shellcheck, shfmt, markdownlint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          notes="/tmp/ntfsmount-RELEASE_NOTES.md"
          if [[ -f "docs/RELEASE_NOTES/${ver}.md" ]] && bash scripts/check-release-notes.sh "$ver"; then
            /bin/cp "docs/RELEASE_NOTES/${ver}.md" "$notes"
            echo "using hand-written docs/RELEASE_NOTES/${ver}.md"
          else
            bash scripts/generate-release-notes.sh "$GITHUB_REF_NAME" -o "$notes"
            bash scripts/check-release-notes.sh --file "$notes"
            echo "using generated notes from git log"
          fi
      - name: Import Developer ID
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: bash scripts/ci-import-signing.sh
      - name: Prepare runtime and package PKG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          FUSE_T_REDISTRIBUTION_OK: ${{ vars.FUSE_T_REDISTRIBUTION_OK }}
        run: |
          set -euo pipefail
          bash scripts/prepare-runtime.sh
          bash scripts/check-runtime-sha256.sh
          bash scripts/package-pkg.sh
      - name: SHA256 of NTFSMount.pkg
        id: pkg_sha256
        run: |
          set -euo pipefail
          pkg=dist/NTFSMount.pkg
          [[ -f "$pkg" ]] || { echo "error: missing $pkg" >&2; exit 1; }
          # package-pkg.sh already hashed after staple; re-run so the log always has SHA256=.
          bash scripts/write-pkg-sha256.sh "$pkg"
          hash="$(/usr/bin/awk '{print $1; exit}' "${pkg}.sha256")"
          [[ ${#hash} -eq 64 ]] || { echo "error: invalid SHA256: $hash" >&2; exit 1; }
          echo "SHA256=${hash}"
          echo "hash=${hash}" >> "$GITHUB_OUTPUT"
          {
            echo "## NTFSMount.pkg"
            echo "SHA256=\`${hash}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          /usr/bin/shasum -a 256 "$pkg"
      - name: Upload PKG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NTFSMount-pkg
          path: |
            dist/NTFSMount.pkg
            dist/NTFSMount.pkg.sha256
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FUSE_T_REDISTRIBUTION_OK: ${{ vars.FUSE_T_REDISTRIBUTION_OK }}
        run: |
          set -euo pipefail
          [[ -f dist/NTFSMount.pkg ]] || { echo "error: missing dist/NTFSMount.pkg" >&2; exit 1; }
          [[ -f dist/NTFSMount.pkg.sha256 ]] || { echo "error: missing dist/NTFSMount.pkg.sha256" >&2; exit 1; }
          app=""
          [[ -d dist/NTFSMount.app ]] && app=dist/NTFSMount.app
          [[ -z "$app" && -d /tmp/NTFSMount.app ]] && app=/tmp/NTFSMount.app
          notarized=0
          if [[ -n "$app" ]] && xcrun stapler validate "$app" >/dev/null 2>&1; then
            notarized=1
          elif xcrun stapler validate dist/NTFSMount.pkg >/dev/null 2>&1; then
            notarized=1
          fi
          notes="$(/usr/bin/mktemp)"
          {
            if [[ "${FUSE_T_REDISTRIBUTION_OK:-}" == "1" && "$notarized" == "1" ]]; then
              echo "已公证。仍须确认 FUSE-T 书面许可后再当作产品分发。见 NOTICE。"
            else
              echo "个人使用预发布。未取得 FUSE-T 书面许可前不要镜像或当产品分发。见 NOTICE。"
              if [[ "$notarized" != "1" ]]; then
                echo "本构建未公证：Gatekeeper 会拦截。仓库 Secrets 配好证书与 App Store Connect API Key 后重打 tag。"
              fi
            fi
            echo
            /bin/cat /tmp/ntfsmount-RELEASE_NOTES.md
            echo
            /bin/cat dist/NTFSMount.pkg.release-notes.md
          } > "$notes"
          assets=(dist/NTFSMount.pkg dist/NTFSMount.pkg.sha256)
          official=0
          [[ "$notarized" == "1" && "${FUSE_T_REDISTRIBUTION_OK:-}" == "1" ]] && official=1
          if [[ "$official" == "1" ]]; then
            title="${GITHUB_REF_NAME}"
          elif [[ "$notarized" == "1" ]]; then
            title="${GITHUB_REF_NAME}（个人使用，已公证）"
          else
            title="${GITHUB_REF_NAME}（个人使用，未公证）"
          fi
          if gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" "${assets[@]}" --clobber
            gh release edit "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file "$notes" --latest
          else
            gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes-file "$notes" "${assets[@]}"
          fi
      - name: Delete signing keychain
        if: always()
        run: |
          if [[ -n "${APP_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$APP_SIGNING_KEYCHAIN" || true
          fi

  # tag 上跟在 PKG (tag) 之后：对已发布安装包再算一遍 SHA256 并打日志/Artifact。
  # 人工创建 Release 并附上安装包时同样跑（不依赖 tag job）。
  release-sha256:
    name: Release SHA256
    if: always() && !cancelled() && (github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.pkg-on-tag.result == 'success'))
    runs-on: macos-14
    permissions:
      contents: write
    needs: [pkg-on-tag]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hash published package and attach sidecar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          work="$(/usr/bin/mktemp -d /tmp/ntfsmount-sha256.XXXXXX)"
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$work" --pattern 'NTFSMount.pkg'; then
            echo "error: Release $TAG 没有 NTFSMount.pkg。先用 ./scripts/package-pkg.sh 打包并附上安装包。" >&2
            exit 1
          fi
          pkg="$work/NTFSMount.pkg"
          [[ -f "$pkg" ]] || { echo "error: 未下载到 $pkg" >&2; exit 1; }
          bash scripts/write-pkg-sha256.sh "$pkg"
          mkdir -p dist
          /bin/cp "$work/NTFSMount.pkg.sha256" dist/NTFSMount.pkg.sha256
          hash="$(/usr/bin/awk '{print $1; exit}' dist/NTFSMount.pkg.sha256)"
          echo "SHA256=${hash}"
          {
            echo "## Published NTFSMount.pkg"
            echo "SHA256=\`${hash}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$work/NTFSMount.pkg.sha256" --clobber
          body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          ver="${TAG#v}"
          changelog="docs/RELEASE_NOTES/${ver}.md"
          notes_src=""
          if [[ -f "$changelog" ]] && bash scripts/check-release-notes.sh "$ver"; then
            notes_src="$changelog"
          fi
          if ! printf '%s\n' "$body" | /usr/bin/grep -Fq "Helper: reinstall required?"; then
            if [[ -z "$notes_src" ]]; then
              notes_src="$work/generated-notes.md"
              bash scripts/generate-release-notes.sh "$TAG" -o "$notes_src"
              bash scripts/check-release-notes.sh --file "$notes_src"
            fi
          fi
          if printf '%s\n' "$body" | /usr/bin/grep -q "$hash" && printf '%s\n' "$body" | /usr/bin/grep -Fq "Helper: reinstall required?"; then
            echo "Release body already contains changelog and SHA256"
          else
            {
              printf '%s\n' "$body"
              if ! printf '%s\n' "$body" | /usr/bin/grep -Fq "Helper: reinstall required?"; then
                [[ -n "$notes_src" && -f "$notes_src" ]] || { echo "error: no release notes for $TAG" >&2; exit 1; }
                echo
                /bin/cat "$notes_src"
              fi
              if ! printf '%s\n' "$body" | /usr/bin/grep -q "$hash"; then
                echo
                /bin/cat "$work/NTFSMount.pkg.release-notes.md"
              fi
            } > "$work/release-body.md"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$work/release-body.md"
          fi
      - name: Upload SHA256 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NTFSMount-release-sha256
          path: dist/NTFSMount.pkg.sha256
          if-no-files-found: error
