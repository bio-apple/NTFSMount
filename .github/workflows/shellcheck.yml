# ShellCheck：仓库内 bash（含 helper/ntfs-rw-helper、scripts/ntfsmount）。
# push/PR 独立跑，README badge 指向本文件；build.yml 以 workflow_call 调用，
# 打 tag 出安装包前必须先过检查。
name: ShellCheck
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: bash scripts/ci-shellcheck.sh
