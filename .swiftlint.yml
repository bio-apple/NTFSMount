# SwiftLint：命名规范 / 代码风格 / 复杂度控制。只扫 Sources/ 与 Tests/。
# implicit_return、force_unwrapping 等不启用，避免把现有 App 刷成警告墙。

included:
  - Sources
  - Tests

excluded:
  - .build
  - .swiftpm
  - Package.swift

only_rules:
  - identifier_name
  - type_name
  - trailing_whitespace
  - colon
  - comma
  - opening_brace
  - statement_position
  - line_length
  - cyclomatic_complexity
  - nesting
  - function_body_length
  - type_body_length
  - file_length

# 1. 命名规范
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 48
    error: 60
  excluded:
    - i
    - j
    - id
    - ok
    - t
    - d
    - a
    - n
    - s
    - x
    - y
    - fd
    - cr
    - fm

type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60

# 2. 代码风格
colon:
  severity: error
comma: error
opening_brace:
  severity: error
statement_position:
  statement_mode: default
  severity: error
trailing_whitespace:
  severity: error
  ignores_empty_lines: false
  ignores_comments: true
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

# 3. 复杂度控制（阈值按现有 VolumeStore / MainWindow / Privileged 能过）
cyclomatic_complexity:
  warning: 20
  error: 30
  ignores_case_statements: true
nesting:
  type_level:
    warning: 3
    error: 5
  function_level:
    warning: 6
    error: 10
function_body_length:
  warning: 80
  error: 150
type_body_length:
  warning: 550
  error: 700
file_length:
  warning: 600
  error: 1000
  ignore_comment_only_lines: true
